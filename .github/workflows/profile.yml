name: refresh profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "data/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data and render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python tools/update.py

      - name: Commit if anything moved
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md
          git commit -m "chore: refresh live profile data [skip ci]"
          git push
